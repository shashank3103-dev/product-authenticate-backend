version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    labels:
      - "dependencies"
      - "javascript"
      - "react-native"
      - "typescript"

    commit-message:
      prefix: "chore"

    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore"

    open-pull-requests-limit: 5
